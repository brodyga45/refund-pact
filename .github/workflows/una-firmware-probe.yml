name: UNA official example firmware feasibility

on:
  push:
    branches: [codex/una-build-probe]
    paths: [.github/workflows/una-firmware-probe.yml, README.md]

permissions: {}

jobs:
  firmware:
    if: github.repository == 'brodyga45/refund-pact'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install open GNU ARM compiler and packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3-venv ninja-build
          arm-none-eabi-g++ --version
      - name: Fetch pinned official public SDK and LVGL
        run: |
          git init sdk
          git -C sdk remote add origin https://github.com/UNAWatch/una-sdk.git
          git -C sdk fetch --depth 1 --filter=blob:none origin d71d0dc3bad7d47282fcf5a4c53a3f0f2031afb1
          git -C sdk sparse-checkout init --cone
          git -C sdk sparse-checkout set Libs cmake Utilities/Scripts Docs/Tutorials/HelloWorld ThirdParty/coreJSON ThirdParty/tinycbor_version
          git -C sdk checkout --detach FETCH_HEAD
          test "$(git -C sdk rev-parse HEAD)" = d71d0dc3bad7d47282fcf5a4c53a3f0f2031afb1
          git -C sdk submodule update --init --depth 1 --filter=blob:none ThirdParty/lvgl
          test "$(git -C sdk/ThirdParty/lvgl rev-parse HEAD)" = 85aa60d18b3d5e5588d7b247abf90198f07c8a63
      - name: Configure and build the unmodified official HelloWorld LVGL app
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r sdk/Utilities/Scripts/app_packer/requirements.txt
          export UNA_SDK="$PWD/sdk"
          cmake -S sdk/Docs/Tutorials/HelloWorld/Software/Apps/HelloWorldLVGL-CMake -B firmware-build -G Ninja -DBUILD_VERSION=1.0.0 -DUNA_PYTHON_EXECUTABLE="$PWD/.venv/bin/python"
          cmake --build firmware-build -j 2
      - name: Report package identity without uploading artifacts or cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('sdk/Docs/Tutorials/HelloWorld/OutputLVGL')
          packages = list(root.rglob('*.uapp'))
          assert packages, 'Build did not produce a .uapp'
          for path in packages:
              raw = path.read_bytes()
              assert raw, 'Empty .uapp'
              print(json.dumps({'file': str(path), 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest(), 'device_execution_tested': False}))
          PY
